name: notion-keeper
services:
  notion-keeper:
    image: ghcr.io/asierzunzu/notionkeeper:main
    container_name: notion-keeper
    volumes:
      - ${BACKUP_PATH}:/${DOWNLOADS_DIRECTORY_PATH}
    env_file: ".env"
    restart: unless-stopped
    # Runs as PUID:PGID from .env (default 1000:1000), not root.
    labels:
      # Watchtower
      com.centurylinklabs.watchtower.enable: true
